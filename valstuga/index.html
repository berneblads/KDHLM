<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valstuga | KD Hässleholm</title>
    <meta
      name="description"
      content="Internt schema för tider i valstugan för Kristdemokraterna Hässleholm."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#005ea1" />
    <link rel="canonical" href="https://kdhlm.se/valstuga" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/KD-logo-vit.png" />
    <link rel="apple-touch-icon" href="/assets/KD-logo-vit.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="valstuga-page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Till startsidan">
        <img
          class="brand-logo"
          src="/assets/Hässleholm-sida-bla-300dpi.png"
          alt="KD Hässleholm"
          width="1735"
          height="681"
          decoding="async"
        />
      </a>

      <nav aria-label="Huvudnavigering">
        <a href="/">Start</a>
        <a href="/#politik">Vår politik</a>
        <a href="/#kandidater">Kandidater</a>
        <a href="/#pdf">Valprogram</a>
      </nav>

      <div class="header-actions">
        <a
          class="header-action header-action-secondary"
          href="https://docs.google.com/spreadsheets/d/12oN-9c2rVdb59qPNnpP7Y2jkYsyuvWCdNem3PiSsblM/edit?gid=0#gid=0"
          target="_blank"
          rel="noreferrer"
        >Öppna i Google Sheets</a>
        <a
          class="header-action"
          href="https://kristdemokraterna.se/vart-parti/foretradare/kd-lokalt/skane/hassleholm"
          target="_blank"
          rel="noreferrer"
        >Kontakta oss</a>
      </div>
    </header>

    <main class="valstuga-main">
      <p class="valstuga-info">
        Nedan kan du se vilka tider som är lediga för att bemanna valstugan.
        Vänligen mejla
        <a href="mailto:erika.heilutbult@gmail.com">erika.heilutbult@gmail.com</a>
        och meddela när du kan kampanja.
      </p>

      <section class="sheet-section" aria-label="Schema för valstugan">
        <iframe
          class="sheet-frame"
          title="Schema för valstugan"
          src="https://docs.google.com/spreadsheets/d/12oN-9c2rVdb59qPNnpP7Y2jkYsyuvWCdNem3PiSsblM/htmlembed?single=true&amp;gid=0&amp;range=A:G&amp;widget=false&amp;headers=false&amp;chrome=false"
          loading="lazy"
        ></iframe>
      </section>
    </main>
  </body>
</html>
